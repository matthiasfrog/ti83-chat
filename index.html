<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marilyn</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            margin: 5px 0;
            font-size: 16px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 70%;
        }

        #status {
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #eee;
            padding: 10px;
        }
    </style>
</head>

<body>

    <button id="connect">
        Connect to Marilyn
    </button>

    <p id="status">
        Disconnected
    </p>


    <h3>User Prompt:</h3>

    <pre id="received"></pre>


    <h3>Marilyn's Response

    <pre id="answer"></pre>


    <hr>


    <h3>Send Override:</h3>

    <input
        id="message"
        type="text"
        placeholder="Type message..."
    >

    <button id="send">
        Send
    </button>


<script>

const SERVICE_UUID =
    "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
    "87654321-4321-4321-4321-ba0987654321";

const AI_URL =
    "https://ti83.matthias-frog.workers.dev/";


let device;
let characteristic;


/* =====================================================
   CONNECT TO XIAO
===================================================== */

async function connectToMarilyn() {

    try {

        document.getElementById("status").textContent =
            "Connecting...";


        const server =
            await device.gatt.connect();


        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        await characteristic.startNotifications();


        characteristic.removeEventListener(
            "characteristicvaluechanged",
            handleBLEMessage
        );


        characteristic.addEventListener(
            "characteristicvaluechanged",
            handleBLEMessage
        );


      document.getElementById("status").textContent =
    "CONNECTED to " + device.name;

device.removeEventListener(
    "gattserverdisconnected",
    handleDisconnect
);

device.addEventListener(
    "gattserverdisconnected",
    handleDisconnect
);

        console.log("Connected to Marilyn");


    }

    catch (error) {

        console.error(error);

        characteristic = null;


        document.getElementById("status").textContent =
            "Disconnected";


        throw error;

    }

}

    /* =====================================================
   AUTOMATIC RECONNECT
===================================================== */

let reconnectTimer = null;
let reconnecting = false;


async function tryAutoConnect() {

    if (reconnecting) {
        return;
    }

    if (device && device.gatt && device.gatt.connected) {
        return;
    }

    if (!navigator.bluetooth.getDevices) {
        console.log("Automatic Bluetooth reconnect is not supported.");
        return;
    }

    reconnecting = true;

    try {

        const devices =
            await navigator.bluetooth.getDevices();

        const found =
            devices.find(d => d.name === "Marilyn");

        if (!found) {
            console.log("Marilyn has not been authorized yet.");
            return;
        }

        device = found;

        document.getElementById("status").textContent =
            "Found Marilyn. Connecting...";

        await connectToMarilyn();

    }

    catch (error) {

        console.log(
            "Marilyn not available yet."
        );

        document.getElementById("status").textContent =
            "Waiting for Marilyn...";

    }

    finally {

        reconnecting = false;

    }

}


/* =====================================================
   KEEP TRYING
===================================================== */

function startAutoReconnect() {

    if (reconnectTimer !== null) {
        return;
    }

    tryAutoConnect();

    reconnectTimer =
        setInterval(
            tryAutoConnect,
            3000
        );

}

/* =====================================================
   HANDLE DISCONNECT
===================================================== */

function handleDisconnect() {

    characteristic = null;

    document.getElementById("status").textContent =
        "Marilyn disconnected. Reconnecting...";

    startAutoReconnect();

}
    
/* =====================================================
   MANUAL CONNECT BUTTON
===================================================== */

document.getElementById("connect").onclick = async () => {

    try {

        document.getElementById("status").textContent =
            "Scanning...";


        device = await navigator.bluetooth.requestDevice({
            filters: [
                {
                    services: [SERVICE_UUID]
                }
            ]
        });


        await connectToMarilyn();

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "ERROR: " + error;

    }

};


/* =====================================================
   RECEIVE MESSAGE FROM TI-83
===================================================== */
    
async function handleBLEMessage(event) {
    try {
        const bytes =
            new Uint8Array(event.target.value.buffer);

        const text =
            new TextDecoder().decode(bytes);

        console.log("Received from TI-83:", text);

        document.getElementById("received")
            .textContent = text;

        document.getElementById("answer")
            .textContent = "Thinking...";

        // Tell the calculator we're working
        await sendToTI83("WAIT");

        // Ask Gemini
        const response =
            await fetch(AI_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: text
                })
            });

        const data = await response.json();

        if (!response.ok) {
            console.error("FULL AI ERROR:", data);
            throw new Error(JSON.stringify(data));
        }

        const answer =
            data.answer || "No answer received.";

        console.log("AI answer:", answer);

        document.getElementById("answer")
            .textContent = answer;

        // Send final answer
        await sendToTI83(answer);

    } catch (error) {
        console.error(error);

        document.getElementById("answer")
            .textContent =
                "ERROR: " + error.message;
    }
}

/* =====================================================
   SEND TEXT TO TI-83
===================================================== */

async function sendToTI83(text) {

    if (!characteristic) {

        throw new Error(
            "Marilyn is not connected."
        );

    }


    /*
     * Convert text to UTF-8
     */

    const bytes =
        new TextEncoder().encode(text);


    /*
     * BLE write
     */

    await characteristic.writeValueWithResponse(
        bytes
    );


    console.log(
        "Sent to Marilyn:",
        text
    );

}
    
/* =====================================================
   START AUTOMATIC CONNECTION
===================================================== */

startAutoReconnect();

/* =====================================================
   MANUAL SEND BUTTON
===================================================== */

document.getElementById("send").onclick = async () => {

    try {

        const input =
            document.getElementById("message");


        const text =
            input.value;


        if (text.length === 0) {
            return;
        }


        await sendToTI83(text);


        input.value = "";

    }

    catch (error) {

        console.error(error);

        alert(
            "Send failed: " +
            error.message
        );

    }

};

</script>

</body>
</html>
