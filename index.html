<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Marilyn</title>

    <style>

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            margin: 5px 0;
            font-size: 16px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 70%;
        }

        #status {
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #eee;
            padding: 10px;
        }

    </style>

</head>


<body>


    <button id="connect">
        Connect to Marilyn
    </button>


    <p id="status">
        Disconnected
    </p>


    <h3>User Prompt:</h3>

    <pre id="received"></pre>


    <h3>Marilyn's Response</h3>

    <pre id="answer"></pre>


    <hr>


    <h3>Send Override:</h3>

    <input
        id="message"
        type="text"
        placeholder="Type message..."
    >

    <button id="send">
        Send
    </button>



<script>


const SERVICE_UUID =
    "12345678-1234-1234-1234-1234567890ab";


const CHARACTERISTIC_UUID =
    "87654321-4321-4321-4321-ba0987654321";


const AI_URL =
    "https://ti83.matthias-frog.workers.dev/";


let device = null;

let characteristic = null;

let reconnecting = false;



/* =====================================================
   CONNECT TO MARILYN
===================================================== */

async function connectToMarilyn() {

    if (!device) {
        return;
    }

    if (
        device.gatt &&
        device.gatt.connected &&
        characteristic
    ) {
        return;
    }


    try {

        document.getElementById("status").textContent =
            "Connecting...";


        const server =
            await device.gatt.connect();


        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        await characteristic.startNotifications();


        characteristic.removeEventListener(
            "characteristicvaluechanged",
            handleBLEMessage
        );


        characteristic.addEventListener(
            "characteristicvaluechanged",
            handleBLEMessage
        );


        device.removeEventListener(
            "gattserverdisconnected",
            handleDisconnect
        );


        device.addEventListener(
            "gattserverdisconnected",
            handleDisconnect
        );


        document.getElementById("status").textContent =
            "CONNECTED to " + device.name;


        console.log(
            "Connected to",
            device.name
        );


    }

    catch (error) {

        characteristic = null;

        document.getElementById("status").textContent =
            "Waiting for Marilyn...";

        throw error;

    }

}



/* =====================================================
   FIND AND CONNECT TO MARILYN
===================================================== */

async function tryAutoConnect() {

    if (reconnecting) {
        return;
    }


    if (
        device &&
        device.gatt &&
        device.gatt.connected &&
        characteristic
    ) {
        return;
    }


    if (
        !navigator.bluetooth ||
        !navigator.bluetooth.getDevices
    ) {

        console.log(
            "Bluetooth getDevices() unavailable."
        );

        return;

    }


    reconnecting = true;


    try {

        const devices =
            await navigator.bluetooth.getDevices();


        const found =
            devices.find(
                d => d.name === "Marilyn"
            );


        if (!found) {

            console.log(
                "Marilyn not authorized yet."
            );

            return;

        }


        device = found;


        console.log(
            "Found Marilyn."
        );


        await connectToMarilyn();

    }

    catch (error) {

        console.log(
            "Marilyn is not available yet."
        );

    }

    finally {

        reconnecting = false;

    }

}



/* =====================================================
   AUTOMATIC RECONNECT LOOP
===================================================== */

setInterval(
    tryAutoConnect,
    3000
);



/* =====================================================
   HANDLE DISCONNECT
===================================================== */

function handleDisconnect() {

    characteristic = null;


    document.getElementById("status").textContent =
        "Marilyn disconnected. Reconnecting...";


    tryAutoConnect();

}



/* =====================================================
   MANUAL FIRST-TIME CONNECTION
===================================================== */

document.getElementById("connect").onclick =
    async function() {

        try {

            document.getElementById("status").textContent =
                "Scanning...";


            device =
                await navigator.bluetooth.requestDevice({

                    filters: [
                        {
                            services: [
                                SERVICE_UUID
                            ]
                        }
                    ]

                });


            await connectToMarilyn();

        }

        catch (error) {

            console.error(error);


            document.getElementById("status").textContent =
                "ERROR: " + error.message;

        }

    };



/* =====================================================
   RECEIVE MESSAGE FROM TI-83
===================================================== */

async function handleBLEMessage(event) {

    try {

        const bytes =
            new Uint8Array(
                event.target.value.buffer
            );


        const text =
            new TextDecoder().decode(bytes);


        console.log(
            "Received from TI-83:",
            text
        );


        document.getElementById("received")
            .textContent = text;


        document.getElementById("answer")
            .textContent = "Thinking...";


        /* Tell calculator we are working */

        await sendToTI83("WAIT");


        /* Ask Gemini */

        const response =
            await fetch(
                AI_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question: text
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(
                "FULL AI ERROR:",
                data
            );

            throw new Error(
                JSON.stringify(data)
            );

        }


        const answer =
            data.answer ||
            "No answer received.";


        console.log(
            "AI answer:",
            answer
        );


        document.getElementById("answer")
            .textContent = answer;


        /* Send final answer to TI-83 */

        await sendToTI83(answer);

    }

    catch (error) {

        console.error(error);


        document.getElementById("answer")
            .textContent =
                "ERROR: " +
                error.message;

    }

}



/* =====================================================
   SEND TEXT TO TI-83
===================================================== */

async function sendToTI83(text) {

    if (!characteristic) {

        throw new Error(
            "Marilyn is not connected."
        );

    }


    const bytes =
        new TextEncoder().encode(text);


    await characteristic.writeValueWithResponse(
        bytes
    );


    console.log(
        "Sent to Marilyn:",
        text
    );

}



/* =====================================================
   MANUAL SEND
===================================================== */

document.getElementById("send").onclick =
    async function() {

        try {

            const input =
                document.getElementById("message");


            const text =
                input.value;


            if (text.length === 0) {
                return;
            }


            await sendToTI83(text);


            input.value = "";

        }

        catch (error) {

            console.error(error);


            alert(
                "Send failed: " +
                error.message
            );

        }

    };



/* =====================================================
   START AUTOMATIC CONNECTION
===================================================== */

tryAutoConnect();


</script>


</body>

</html>
