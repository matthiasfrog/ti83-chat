<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TI-83 AI</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            margin: 5px 0;
            font-size: 16px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 70%;
        }

        #status {
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #eee;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>TI-83 AI</h1>

    <button id="connect">
        Connect to TI-83
    </button>

    <p id="status">
        Disconnected
    </p>


    <h3>Question from TI-83:</h3>

    <pre id="received"></pre>


    <h3>AI Answer:</h3>

    <pre id="answer"></pre>


    <hr>


    <h3>Manual Send:</h3>

    <input
        id="message"
        type="text"
        placeholder="Type message..."
    >

    <button id="send">
        Send
    </button>


<script>

const SERVICE_UUID =
    "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
    "87654321-4321-4321-4321-ba0987654321";

const AI_URL =
    "https://ti83.matthias-frog.workers.dev/";


let device;
let characteristic;


/* =====================================================
   CONNECT TO XIAO
===================================================== */

document.getElementById("connect").onclick = async () => {

    try {

        document.getElementById("status").textContent =
            "Scanning...";


        device = await navigator.bluetooth.requestDevice({
            filters: [
                {
                    services: [SERVICE_UUID]
                }
            ]
        });


        document.getElementById("status").textContent =
            "Connecting...";


        const server =
            await device.gatt.connect();


        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        /* Listen for TI-83 messages */

        await characteristic.startNotifications();


        characteristic.addEventListener(
            "characteristicvaluechanged",
            handleBLEMessage
        );


        document.getElementById("status").textContent =
            "CONNECTED to " + device.name;

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "ERROR: " + error;

    }

};


/* =====================================================
   RECEIVE MESSAGE FROM TI-83
===================================================== */

let waitTimer = null;

async function handleBLEMessage(event) {
    try {
        const bytes =
            new Uint8Array(
                event.target.value.buffer
            );

        const text =
            new TextDecoder().decode(bytes);

        console.log(
            "Received from TI-83:",
            text
        );

        document.getElementById("received")
            .textContent = text;

        document.getElementById("answer")
            .textContent = "Thinking...";

        // Send WAIT immediately.
        await sendToTI83("WAIT");

        // Keep refreshing WAIT every 5 seconds
        // while Gemini is generating the answer.
        clearInterval(waitTimer);

        waitTimer = setInterval(async () => {
            try {
                await sendToTI83("WAIT");
                console.log("Sent WAIT");
            } catch (error) {
                console.error("WAIT send failed:", error);
            }
        }, 5000);

        const response =
            await fetch(AI_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: text
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            console.error("FULL AI ERROR:", data);
            throw new Error(
                JSON.stringify(data)
            );
        }

        const answer =
            data.answer || "No answer received.";

        console.log(
            "AI answer:",
            answer
        );

        document.getElementById("answer")
            .textContent = answer;

        // Gemini finished.
        clearInterval(waitTimer);
        waitTimer = null;

        // Send the real answer.
        await sendToTI83(answer);

    } catch (error) {
        console.error(error);

        clearInterval(waitTimer);
        waitTimer = null;

        document.getElementById("answer")
            .textContent =
                "ERROR: " + error.message;
    }
}


/* =====================================================
   SEND TEXT TO TI-83
===================================================== */

async function sendToTI83(text) {

    if (!characteristic) {

        throw new Error(
            "TI-83 is not connected."
        );

    }


    /*
     * Convert text to UTF-8
     */

    const bytes =
        new TextEncoder().encode(text);


    /*
     * BLE write
     */

    await characteristic.writeValueWithResponse(
        bytes
    );


    console.log(
        "Sent to TI-83:",
        text
    );

}


/* =====================================================
   MANUAL SEND BUTTON
===================================================== */

document.getElementById("send").onclick = async () => {

    try {

        const input =
            document.getElementById("message");


        const text =
            input.value;


        if (text.length === 0) {
            return;
        }


        await sendToTI83(text);


        input.value = "";

    }

    catch (error) {

        console.error(error);

        alert(
            "Send failed: " +
            error.message
        );

    }

};

</script>

</body>
</html>
